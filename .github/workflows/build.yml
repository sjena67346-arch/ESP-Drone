name: Build ESP-Drone Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Build firmware
        shell: bash
        run: |
          # Source the ESP-IDF environment to make idf.py available
          . /opt/esp/idf/export.sh
          
          # Navigate into the firmware directory safely (handling case sensitivity)
          if [ -d "Firmware" ]; then cd Firmware; elif [ -d "firmware" ]; then cd firmware; fi
          
          idf.py set-target esp32
          idf.py build
      - name: Upload compiled bins
        uses: actions/upload-artifact@v4
        with:
          name: esp-drone-bins
          path: |
            **/build/bootloader/bootloader.bin
            **/build/partition_table/partition-table.bin
            **/build/*.bin
            

name: Build ESP-Drone Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Locate project and build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          
          # Find the folder containing CMakeLists.txt for the drone project
          PROJECT_DIR=$(find . -name "CMakeLists.txt" -not -path "*/.*" -exec dirname {} \; | grep -E "firmware|esp-drone" | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Searching all directories for CMakeLists.txt..."
            PROJECT_DIR=$(find . -name "CMakeLists.txt" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          fi
          
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          idf.py set-target esp32
          idf.py build
      - name: Upload compiled bins
        uses: actions/upload-artifact@v4
        with:
          name: esp-drone-bins
          path: |
            **/build/bootloader/bootloader.bin
            **/build/partition_table/partition-table.bin
            **/build/*.bin
